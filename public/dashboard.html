<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jeeva Organics Dairy - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Navbar -->
  <nav class="bg-green-700 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <h1 class="text-2xl font-bold">జీవ</h1>
        <div>
          <p class="font-semibold">Jeeva Organics Dairy</p>
          <p class="text-xs text-green-200">Pure Organic Dairy</p>
        </div>
      </div>
      <div class="flex items-center gap-6">
        <a href="products.html" class="hover:text-green-200 flex items-center gap-1">
          <i class="fas fa-shopping-bag"></i> Products
        </a>
        <a href="youcart.html" class="hover:text-green-200 flex items-center gap-1">
          <i class="fas fa-cart-shopping"></i> Cart
        </a>
        <a href="#" onclick="logout()" class="hover:text-red-300">
          <i class="fas fa-sign-out-alt"></i> Logout
        </a>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">Good Morning, <span id="username">User</span> 👋</h1>
    <p class="text-gray-600 mb-8">Fresh organic dairy delivered to your door</p>

    <!-- Quick Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
      <div class="bg-white p-6 rounded-2xl shadow">
        <p class="text-gray-500">Today's Delivery</p>
        <p class="text-3xl font-bold text-green-600 mt-2">1L Cow Milk</p>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow">
        <p class="text-gray-500">Active Subscription</p>
        <p class="text-3xl font-bold text-green-600 mt-2">Yes</p>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow">
        <p class="text-gray-500">Total Orders</p>
        <p class="text-3xl font-bold text-green-600 mt-2" id="totalOrders">12</p>
      </div>
    </div>

    <!-- Featured Products -->
    <h2 class="text-2xl font-semibold mb-6">Our Fresh Products</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6" id="featuredProducts">
      <!-- Products will be loaded by JavaScript -->
    </div>

    <div class="text-center mt-10">
      <a href="products.html" 
         class="inline-block bg-green-600 text-white px-8 py-3 rounded-xl font-semibold hover:bg-green-700">
        View All Products →
      </a>
    </div>
  </div>

  <script>
    // Fetch user name
    fetch('/user/profile')
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          document.getElementById('username').textContent = data.data.user_name;
        }
      });

    // Sample featured products (you can fetch from /products API later)
    const featured = [
      {name: "Fresh Cow Milk", price: 60, size: "500ml"},
      {name: "Pure Desi Ghee", price: 280, size: "250ml"},
      {name: "Fresh Curd", price: 50, size: "500g"},
      {name: "Soft Paneer", price: 120, size: "200g"}
    ];

    const container = document.getElementById('featuredProducts');
    featured.forEach(product => {
      container.innerHTML += `
        <div class="bg-white rounded-2xl overflow-hidden shadow hover:shadow-lg transition">
          <div class="h-40 bg-green-100 flex items-center justify-center">
            <i class="fas fa-milk text-6xl text-green-600"></i>
          </div>
          <div class="p-4">
            <h3 class="font-semibold">${product.name}</h3>
            <p class="text-sm text-gray-500">${product.size}</p>
            <p class="text-xl font-bold text-green-700 mt-2">₹${product.price}</p>
            <button onclick="addToCart()" 
                    class="mt-3 w-full bg-green-600 text-white py-2 rounded-lg text-sm hover:bg-green-700">
              Add to Cart
            </button>
          </div>
        </div>
      `;
    });

    function logout() {
      fetch('/logout', { method: 'POST' })
        .then(() => window.location.href = '/login.html');
    }

    function addToCart() {
      alert("Added to cart! (Backend integration pending)");
    }
  </script>
</body>
</html>
